<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABA MARKET 🫧</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      max-width: 500px;
      display: flex;
    }

    .search input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 8px 0 0 8px;
    }

    .search button {
      border: none;
      padding: 0 15px;
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    .cart {
      background: white;
      color: #111;
      border: none;
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #dff9ff, white);
    }

    .hero h1 {
      font-size: 45px;
      margin: 15px 0;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .shop {
      background: #111;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    section {
      max-width: 1100px;
      margin: auto;
      padding: 40px 15px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .categories button {
      padding: 11px 18px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 25px;
      cursor: pointer;
    }

    .categories button:hover {
      background: #111;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ddd;
      text-align: center;
    }

    .product-img {
      height: 180px;
      background: #eee;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      margin-bottom: 15px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 30px;
    }

    @media (max-width: 700px) {
      .top {
        flex-wrap: wrap;
      }

      .logo {
        width: 100%;
        text-align: center;
      }

      .search {
        width: 70%;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 35px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="top">

      <div class="logo">BABA MARKET 🫧</div>

      <div class="search">
        <input id="search" type="text" placeholder="Search products...">
        <button onclick="searchProducts()">🔍</button>
      </div>

      <button class="cart" onclick="showCart()">
        🛒 Cart <span id="count">0</span>
      </button>

    </div>
  </header>

  <div class="hero">
    <h1>BABA MARKET 🫧</h1>
    <p>All Products • Best Deals • Easy Shopping</p>
    <button class="shop" onclick="products()">Shop Now 🛍️</button>
  </div>

  <section>
    <h2>Categories</h2>

    <div class="categories">
      <button onclick="filter('all')">🛍️ All</button>
      <button onclick="filter('fashion')">👕 Fashion</button>
      <button onclick="filter('electronics')">📱 Electronics</button>
      <button onclick="filter('shoes')">👟 Shoes</button>
      <button onclick="filter('gaming')">🎮 Gaming</button>
      <button onclick="filter('home')">🏠 Home</button>
    </div>
  </section>

  <section id="productSection">
    <h2>All Products</h2>

    <div class="products">

      <div class="product" data-category="fashion">
        <div class="product-img">👕</div>
        <h3>Oversized T-Shirt</h3>
        <p class="price">₹499</p>
        <button class="add" onclick="add('Oversized T-Shirt',499)">
          Add to Cart 🛒
        </button>
      </div>

      <div class="product" data-category="electronics">
        <div class="product-img">🎧</div>
        <h3>Wireless Headphones</h3>
        <p class="price">₹999</p>
        <button class="add" onclick="add('Wireless Headphones',999)">
          Add to Cart 🛒
        </button>
      </div>

      <div class="product" data-category="shoes">
        <div class="product-img">👟</div>
        <h3>Running Shoes</h3>
        <p class="price">₹1299</p>
        <button class="add" onclick="add('Running Shoes',1299)">
          Add to Cart 🛒
        </button>
      </div>

      <div class="product" data-category="gaming">
        <div class="product-img">🎮</div>
        <h3>Gaming Controller</h3>
        <p class="price">₹1499</p>
        <button class="add" onclick="add('Gaming Controller',1499)">
          Add to Cart 🛒
        </button>
      </div>

      <div class="product" data-category="home">
        <div class="product-img">💡</div>
        <h3>Smart LED Lamp</h3>
        <p class="price">₹699</p>
        <button class="add" onclick="add('Smart LED Lamp',699)">
          Add to Cart 🛒
        </button>
      </div>

      <div class="product" data-category="electronics">
        <div class="product-img">⌚</div>
        <h3>Smart Watch</h3>
        <p class="price">₹1999</p>
        <button class="add" onclick="add('Smart Watch',1999)">
          Add to Cart 🛒
        </button>
      </div>

    </div>
  </section>

  <footer>
    <h2>BABA MARKET 🫧</h2>
    <p>© 2026 BABA MARKET</p>
  </footer>

  <script>
    let cart = [];

    function add(name, price) {
      cart.push({name, price});
      document.getElementById("count").innerText = cart.length;
      alert(name + " cart mein add ho gaya 🛒");
    }

    function showCart() {
      if (cart.length === 0) {
        alert("Cart abhi empty hai 🛒");
        return;
      }

      let total = 0;
      let items = "";

      cart.forEach(item => {
        total += item.price;
        items += item.name + " - ₹" + item.price + "\n";
      });

      alert(
        "🛒 YOUR CART\n\n" +
        items +
        "\nTotal: ₹" + total
      );
    }

    function filter(category) {
      document.querySelectorAll(".product").forEach(product => {
        if (
          category === "all" ||
          product.dataset.category === category
        ) {
          product.style.display = "block";
        } else {
          product.style.display = "none";
        }
      });
    }

    function searchProducts() {
      let value = document
        .getElementById("search")
        .value
        .toLowerCase();

      document.querySelectorAll(".product").forEach(product => {
        let name = product.querySelector("h3").innerText.toLowerCase();

        product.style.display =
          name.includes(value) ? "block" : "none";
      });
    }

    function products() {
      document
        .getElementById("productSection")
        .scrollIntoView({behavior:"smooth"});
    }
  </script>

</body>
</html>
